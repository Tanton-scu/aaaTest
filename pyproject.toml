[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prievo-agent"
version = "1.0.0"
description = "Dataset-driven PriEvO 长任务优化 Agent 后端"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pymysql>=1.1,<2",
  "redis>=5,<7"
]

[project.optional-dependencies]
research = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.0", "pflacco>=1.2"]
papers = ["pypdf>=5,<7"]
rag = ["FlagEmbedding>=1.2.11"]
test = ["numpy>=1.23", "pytest>=8,<9", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prievo_agent = ["api/dashboard.html"]
